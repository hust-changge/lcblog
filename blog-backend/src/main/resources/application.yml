spring:
  application:
    name: lcblog
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lcblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:lcblog}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      enabled: false # 文件由浏览器直传 OSS，应用不接收 multipart

server:
  port: 8080
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    com.aliyun: warn
    org.apache.http: warn

blog:
  site:
    title: ${BLOG_SITE_TITLE:我的技术博客}
    description: ${BLOG_SITE_DESCRIPTION:记录 Java 后端学习、研究笔记与个人项目}
    base-url: ${BLOG_SITE_BASE_URL:http://localhost:8080}
  profile:
    name: "niko"
    intro: "研究生工科在读，记录我的学习笔记以及恋爱日常"
    research: "课题组研究方向是SOFC电池的寿命预测以及健康管理。工作系统往后端开发，agent开发上面靠拢"
    tech-stack:
      - "java,springboot,MVC,redis,mysql,mybatis,springAI"
      - "go"
      - "python,langchain,pytorch,RAG"
    projects:
      - name: "尽请期待"
        description: "尽情期待"
        url: ""
    github: " https://github.com/hust-changge "
    avatar: ""
    background: ""
    announcement: "欢迎来到我的博客"
    start-date: "2026-10-09"
  oss:
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    public-bucket: ${OSS_PUBLIC_BUCKET:}
    private-bucket: ${OSS_PRIVATE_BUCKET:}
    # 可选：公开 Bucket 配置 CDN 私有回源后的固定域名，例如 https://static.example.com
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
    # 可选：ECS RAM 角色名；为空时从环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_SESSION_TOKEN 读取
    ecs-ram-role: ${OSS_ECS_RAM_ROLE:}
  upload:
    policy-ttl: 10m
    download-url-ttl: 5m
    max-image-bytes: 10485760
    max-document-bytes: 52428800
    max-archive-bytes: 104857600

---
spring:
  config:
    activate:
      on-profile: prod
server:
  servlet:
    session:
      cookie:
        secure: true
