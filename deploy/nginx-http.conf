# 本地 / 内网 HTTP 试运行。生产环境请改用 nginx-https.conf。
# 前台 SPA 在 /，后台 SPA 在 /admin/，接口 /api/ 转发到 Spring Boot（同源，无需 CORS）。
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;   # 文件直传 OSS，这里只承载 JSON 与 Markdown 正文
    gzip_static on;

    include /etc/nginx/conf.d/lcblog-common.inc;
}
